<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Health Camps</title>
  <link rel="stylesheet" th:href="@{/camps/css/style.css}">
</head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
  <h1>Health Camps</h1>

  <form class="card filters" th:action="@{/camps}" method="get">
    <input type="text" name="q" th:value="${q}" placeholder="Search camp name">
    <select name="village">
      <option value="">All villages</option>
      <option th:each="v : ${villages}" th:value="${v}" th:text="${v}" th:selected="${v == village}"></option>
    </select>
    <select name="status">
      <option value="">All statuses</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
    </select>
    <button class="btn" type="submit">Search</button>
    <a class="btn secondary" th:href="@{/camps}">Clear</a>
    <a class="btn" th:href="@{/camps/new}" style="margin-left:auto">+ New camp</a>
  </form>

  <table>
    <thead>
      <tr><th>Name</th><th>Type</th><th>Village</th><th>Venue</th><th>Date</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${camps}">
        <td><a th:href="@{/camps/{id}(id=${c.id})}" th:text="${c.name}">Name</a></td>
        <td th:text="${c.campType}">NCD</td>
        <td th:text="${c.village}">Village</td>
        <td th:text="${c.venue}">Venue</td>
        <td th:text="${#temporals.format(c.campDate, 'dd MMM yyyy')}">Date</td>
        <td><span class="badge" th:classappend="${c.status}" th:text="${c.status}">PLANNED</span></td>
        <td><a th:href="@{/camps/{id}/edit(id=${c.id})}">Edit</a></td>
      </tr>
      <!-- Shown only when no camp matches -->
      <tr th:if="${#lists.isEmpty(camps)}"><td colspan="7">No camps found.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
